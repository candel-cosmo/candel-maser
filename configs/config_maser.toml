[inference]
seed = 44
num_warmup = 2500
num_samples = 2000
num_chains = 1
init_strategy = "config"
init_num_samples = 1
n_inner = 30
latent_burnin = 1000        # latent burn-in steps: stage-1 per-galaxy (run_maser.py, config/reid init only) and stage-2 joint-H0 (run_joint_H0.py)
max_tree_depth = 11
target_accept_theta = 0.99
target_accept_r = 0.35
blackjax_initial_step_size = 0.005
phi_step_size = 0.05
reflect_prob = 0.25

[model]
Om = 0.315
use_selection = false
sigma_v_default = 0.25
D_c_prior = "uniform_D_A"
mass_parameterization = "eta"  # choices: "eta", "log_mbh"
R_phys_lo = 0.01
R_phys_hi = 1.5

# DE phi marginalisation.  The value-only, fixed-shape peak partition is the
# all-galaxy GPU-validated production default.  "fixed-grid" remains available
# as the legacy comparison/debug path.  See the all-galaxy report in
# docs/notes/megamaser_phi_integration_all_galaxies.md.
phi_integration = "peak-partition"
n_phi_partition_sys = 129  # nodes in each systemic half-plane
n_phi_partition_hv = 65    # nodes in the red/blue half-plane

# HV (red/blue): 3 uniform sub-ranges centred on the peak:
#   [peak-outer, peak-inner]  (n_phi_hv_low points)
#   [peak-inner, peak+inner]  (n_phi_hv_high points, dense)
#   [peak+inner, peak+outer]  (n_phi_hv_low points)
# Reid convention: red peak at phi=+pi/2, blue peak at phi=-pi/2.
phi_hv_inner_deg = 30.0
phi_hv_outer_deg = 90.0
n_phi_hv_high = 5001
n_phi_hv_low = 2501

# Systemic: marginalise over the full phi range to avoid window leakage
# in fixed-r diagnostics and production runs.
phi_sys_ranges_deg = [[-180, 180]]
n_phi_sys = 10001

# Conditional r_ang MAP grid used by the DE objective and numerical
# quadrature diagnostics. The explicit MCMC sampler uses the non-centred
# log residual z_r = log(r_ang / r_hat(theta)).
n_r_local = 256
n_r_global = 128
K_sigma = 10.0
# Scan the same number of global-radius nodes across the complete physical
# support.  This catches disconnected modes at bad DE proposals without
# adding nodes.  Independent local spans prevent a mode at one support edge
# from collapsing the useful half of the sinh grid.
global_r_full_support = true
asymmetric_r_local = true
# Peak-partition diagnostic: optionally narrow each coarse radial winner with
# a batched value-only stencil before building the local quadrature grid.
# The group selector can restrict this cost to high-velocity spots.  Both
# controls are off by default; NGC4258 opts into all-class refinement below.
peak_r_refine_steps = 0
peak_r_refine_order = 7
peak_r_refine_hv_only = false
# Optional value-only solve for the local radial half-width at
# Delta logL = K_sigma^2 / 2.  Zero keeps the inexpensive curvature width;
# NGC4258 opts into the robust solve below.
peak_r_width_steps = 0
refine_r_center = true
n_refine_steps = 32
conditional_spot_batch = 16

[model.priors.log_MBH]
dist = "uniform"
low = 4.0
high = 10.0

[model.priors.dv_sys]
dist = "normal"
loc = 0.0
scale = 300.0

