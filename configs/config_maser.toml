[inference]
seed = 44
num_warmup = 2500
num_samples = 2000
num_chains = 1
chain_workers = 8
init_strategy = "config"
init_num_samples = 1
n_inner = 30
latent_burnin = 1000        # latent burn-in steps: stage-1 per-galaxy (run_maser.py, config/reid init only) and stage-2 joint-H0 (run_joint_H0.py)
max_tree_depth = 10
target_accept_theta = 0.99
target_accept_r = 0.35
blackjax_initial_step_size = 0.005
phi_step_size = 0.05
reflect_prob = 0.25

[model]
Om = 0.315
use_selection = false
sigma_v_default = 0.25
D_c_prior = "uniform_D_A"
mass_parameterization = "eta"  # choices: "eta", "log_mbh"
R_phys_lo = 0.01
R_phys_hi = 1.5

# DE phi marginalisation.  The value-only, fixed-shape peak partition is the
# all-galaxy GPU-validated production default.  "fixed-grid" remains available
# as the legacy comparison/debug path. See the validation workflow in
# scripts/megamaser/README.md.
phi_integration = "peak-partition"
n_phi_partition_sys = 129  # nodes in each systemic half-plane
n_phi_partition_hv = 65    # nodes in the red/blue half-plane

# HV (red/blue): 3 uniform sub-ranges centred on the peak:
#   [peak-outer, peak-inner]  (n_phi_hv_low points)
#   [peak-inner, peak+inner]  (n_phi_hv_high points, dense)
#   [peak+inner, peak+outer]  (n_phi_hv_low points)
# Reid convention: red peak at phi=+pi/2, blue peak at phi=-pi/2.
phi_hv_inner_deg = 30.0
phi_hv_outer_deg = 90.0
n_phi_hv_high = 5001
n_phi_hv_low = 2501

# Systemic: marginalise over the full phi range to avoid window leakage
# in fixed-r diagnostics and production runs.
phi_sys_ranges_deg = [[-180, 180]]
n_phi_sys = 10001

# Conditional r_ang MAP grid used by the DE objective and numerical
# quadrature diagnostics. The explicit MCMC sampler uses the non-centred
# log residual z_r = log(r_ang / r_hat(theta)).
n_r_local = 256
# Production policy: use the same 176-node full-support discovery grid for
# every galaxy, disk variant, and phi-integration method.  This deliberately
# accepts the documented NGC4258 circular regression from the transfer audit.
n_r_global = 176
K_sigma = 10.0
# Scan the same number of global-radius nodes across the complete physical
# support.  This catches disconnected modes at bad DE proposals without
# adding nodes.  Independent local spans prevent a mode at one support edge
# from collapsing the useful half of the sinh grid.
global_r_full_support = true
asymmetric_r_local = true
# Peak-partition diagnostic: optionally narrow each coarse radial winner with
# a batched value-only stencil before building the local quadrature grid.
# The group selector can restrict this cost to high-velocity spots.  Both
# controls are off by default; NGC4258 opts into all-class refinement below.
peak_r_refine_steps = 0
peak_r_refine_order = 7
peak_r_refine_hv_only = false
# Optional value-only solve for the local radial half-width at
# Delta logL = K_sigma^2 / 2.  Zero keeps the inexpensive curvature width;
# NGC4258 opts into the robust solve below.
peak_r_width_steps = 0
refine_r_center = true
n_refine_steps = 32
conditional_spot_batch = 16

[model.priors.log_MBH]
dist = "uniform"
low = 4.0
high = 10.0

[model.priors.dv_sys]
dist = "normal"
loc = 0.0
scale = 300.0

[model.priors.x0]
dist = "truncated_normal"
mean = 0.0
scale = 500.0
low = -750.0
high = 750.0

[model.priors.y0]
dist = "truncated_normal"
mean = 0.0
scale = 500.0
low = -750.0
high = 750.0

[model.priors.i0]
dist = "sine_angle"
low = 65.0
high = 115.0

[model.priors.Omega0]
dist = "uniform"
low = 0.0
high = 360.0

[model.priors.dOmega_dr]
dist = "uniform"
low = -30.0
high = 30.0

[model.priors.di_dr]
dist = "uniform"
low = -30.0
high = 30.0

[model.priors.d2i_dr2]
dist = "normal"
loc = 0.0
scale = 90.0

[model.priors.d2Omega_dr2]
dist = "normal"
loc = 0.0
scale = 90.0

[model.priors.sigma_x_floor]
dist = "truncated_normal"
mean = 10.0
scale = 5.0
low = 0.5
high = 100.0

[model.priors.sigma_y_floor]
dist = "truncated_normal"
mean = 10.0
scale = 5.0
low = 0.5
high = 100.0

[model.priors.sigma_v_sys]
dist = "truncated_normal"
mean = 2.0
scale = 1.0
low = 0.1
high = 100.0

[model.priors.sigma_v_hv]
dist = "truncated_normal"
mean = 2.0
scale = 1.0
low = 0.1
high = 100.0

[model.priors.sigma_a_floor]
dist = "truncated_normal"
mean = 0.3
scale = 0.15
low = 0.02
high = 0.75

[model.priors.ecc]
dist = "uniform"
low = 0.0
high = 0.05

[model.priors.periapsis]
dist = "uniform"
low = 0.0
high = 360.0

# Gaussian e_x, e_y => e ~ Rayleigh(scale), omega ~ Uniform, smooth through
# e=0 (no funnel for NUTS). scale set from near-circular MCP disks (Reid
# NGC4258 e~0.008).
[model.priors.e_x]
dist = "normal"
loc = 0.0
scale = 0.025

[model.priors.e_y]
dist = "normal"
loc = 0.0
scale = 0.025

# Sample the periapsis warp whenever eccentricity is enabled.
[model.priors.dperiapsis_dr]
dist = "uniform"
low = -360.0
high = 360.0

[model.galaxies.CGCG074-064]
ra = 210.768491
dec = 8.947582
v_sys_obs = 7175
v_cmb_kms = 7172.2  # CMB-frame systemic (Pesce); H0 recession velocity
D_lo = 66.0
D_hi = 150.0
D_de_lo = 80.0
D_de_hi = 125.0
mcmc_sample_n_inner = 60
# The 97/49 scan preserves the circular/eccentric anchor and local-cloud
# accuracy frontier while reducing the static GPU scan shape.
n_phi_partition_sys = 97
n_phi_partition_hv = 49

[model.galaxies.NGC4258]
ra = 184.74009
dec = 47.30372
v_sys_obs = 667
D_lo = 6.0
D_hi = 9.0
# The anchor's extreme geometry makes float32 silently fail (warmup step size
# collapses, mass matrix never adapts); MCMC/DE runners always enable float64.
force_f64 = true
use_ecc = false
ecc_cartesian = true
use_quadratic_warp = false
# Move systemic phi with its fixed linear astrometric-centre response during
# each global NUTS update. This weakens the x0/dv_sys/eta--phi ridge while
# leaving the conditional latent Gibbs target and every high-velocity phi
# unchanged.
mcmc_transport_systemic_phi = true
mcmc_target_accept_theta = 0.85
mcmc_sample_n_inner = 60
# Denser phi grids for NGC4258 (position errors ~3 uas -> narrow phi peaks).
n_phi_hv_high = 20001
n_phi_hv_low = 5001
n_phi_sys = 60001
conditional_spot_batch = 32
# Dense-reference validation at both the Pesce/Reid point and an independent
# unseeded DE checkpoint supports the value-only peak path for NGC4258.  Its
# eccentric Pesce stress point requires a 513-node systemic scan and the
# three-pass value-only radial refinement for every spot class.  The
# eccentric-plus-quadratic-warp Pesce point needs the global 176-node policy
# above to discover three narrow systemic modes; 160 narrowly fails while
# 176, 192, and 256 pass.  The width solve remains eight fixed bisections.
# See the all-galaxy report.
phi_integration = "peak-partition"
n_phi_partition_sys = 513
n_phi_partition_hv = 65
peak_r_refine_steps = 3
peak_r_refine_hv_only = false
peak_r_width_steps = 8

[model.galaxies.NGC5765b]
ra = 222.71461
dec = 5.11449
v_sys_obs = 8465
v_cmb_kms = 8525.7  # CMB-frame systemic (Pesce); H0 recession velocity
D_lo = 85.0
D_hi = 200.0
D_de_lo = 95.0
D_de_hi = 145.0
mcmc_target_accept_theta = 0.95
mcmc_sample_n_inner = 60
# The narrow-mode radial frontier is non-monotonic: 289/320/384/385/416 fail
# at least one stress case, while centred 321 and dense 448/512 pass.  Use the
# cheapest profile that passes both orbit classes.
n_phi_partition_sys = 97
n_phi_partition_hv = 49
n_r_local = 321

[model.galaxies.NGC6264]
ra = 254.3172
dec = 27.8496
v_sys_obs = 10145
v_cmb_kms = 10192.6  # CMB-frame systemic (Pesce); H0 recession velocity
D_lo = 30.0
D_hi = 500.0
D_de_lo = 120.0
D_de_hi = 170.0
mcmc_target_accept_theta = 0.90
# Sustained RTX 3090 timing favours a 32-spot tile for this compact data set.
conditional_spot_batch = 32

[model.galaxies.NGC6323]
ra = 258.32519
dec = 43.78244
v_sys_obs = 7662
v_cmb_kms = 7801.5  # CMB-frame systemic (Pesce); H0 recession velocity
D_lo = 30.0
D_hi = 500.0
D_de_lo = 85.0
D_de_hi = 135.0
mcmc_sample_n_inner = 60

[model.galaxies.UGC3789]
ra = 109.87872
dec = 59.35513
v_sys_obs = 3245
v_cmb_kms = 3319.9  # CMB-frame systemic (Pesce); H0 recession velocity
D_lo = 10.0
D_hi = 100.0
D_de_lo = 30.0
D_de_hi = 65.0
mcmc_target_accept_theta = 0.95
# Denser HV-inner phi grid than the other MCP galaxies.
n_phi_hv_high = 10001
n_phi_hv_low = 2501
# A 97/49 angular scan plus wider, denser local-radius quadrature resolves the
# converged eccentric local-config stress point missed by the legacy grid.
n_phi_partition_sys = 97
n_phi_partition_hv = 49
n_r_local = 384
scan_width_drop = 50.0

[convergence.fixed_r_reference]
n_phi = 200001
spot_batch = 8

[convergence.fixed_r_gradient_reference]
n_phi = 50001
spot_batch = 4

[optimise]
# DE always uses L-SHADE (current-to-pbest/1, success-history F/CR, and linear
# population reduction). Expanded NGC4258 models seed the no-eccentricity,
# no-quadratic-warp [init] point plus expansion-only and linear-mass ridge
# clouds (one quarter of the population each); the remaining half is Sobol.
# Pass --skip-base-model-seed to omit the expanded-model policy.
# Pesce/Reid is never seeded and is scored only as a reference.
log2_N = 14
pop_size = 2000
min_pop_size = 1024
# L-SHADE's population reduction is driven by population fitness evaluations,
# independently of max_generations.  This is not an NFE cap: evaluations
# continue with the minimum population until patience or max_generations stops
# the run.
population_reduction_evaluations = 5000000
max_generations = 50000
patience = 500
# The evaluator always scores one DE candidate per GPU wave. This is an
# implementation invariant, not a configurable optimiser parameter.
log_every = 1
sobol_n_sigma = 5
min_dist_frac = 0.005

[joint.selection]
# HEALPix nside for the isotropic LOS average of the selection normalisation.
los_nside = 2

# Default voxel subsample fraction for the 3D selection-normalisation integral,
# per reconstruction. Lower = less GPU memory and cost, at the price of a
# Monte-Carlo (seed-controlled) estimate of log_Z. The
# --volume-subsample-fraction CLI flag overrides these. The `manticorelocal`
# key matches any reconstruction whose name starts with it.
[joint.selection.volume_subsample_fraction]
default = 1.0
Carrick2015 = 0.25
manticorelocal = 0.1

[joint.priors.sigma_pec]
dist = "maxwell"
scale = 156.7

[joint.priors.Vext_mag]
dist = "uniform"
lower = 0.0
upper = 2000.0

# Informative Vext prior per reconstruction: a static Gaussian (mean + full
# 3x3 covariance) in the ICRS-equatorial Cartesian frame (km/s).  When a
# reconstruction is listed here the joint model samples Vext directly in
# Cartesian from this Gaussian; a reconstruction absent here falls back to the
# uniform Vext_mag prior above.  The numbers are fit offline from each
# reconstruction's own Vext posterior with scripts/megamaser/extract_vext_prior.py
# (--files ... --name ...); the model does not read those posteriors at runtime.
# ManticoreLocalCOLA: |Vext|=111+/-15 km/s, (l,b)=(310,-11) deg.
[joint.priors.Vext_informative.ManticoreLocalCOLA]
mean = [-26.5437, -19.2797, -106.1473]
cov = [[164.2089, -0.4046, -23.1390],
       [-0.4046, 217.7947, 6.2871],
       [-23.1390, 6.2871, 231.2666]]
# Carrick2015: |Vext|=201+/-16 km/s, (l,b)=(306,-16) deg.
[joint.priors.Vext_informative.Carrick2015]
mean = [-36.1490, -19.6859, -196.4901]
cov = [[156.8661, -26.3909, 3.0010],
       [-26.3909, 294.0757, 6.1991],
       [3.0010, 6.1991, 254.0994]]

[joint.inference]
# Stage-2 joint-H0 NUTS settings (override the shared [inference] block, which
# is also used by stage-1 per-galaxy runs).
num_warmup = 3000
num_samples = 5000          # per chain
# Target acceptance lower than the stage-1 0.99: the ~10-parameter toy
# posterior is smooth, so 0.9 cuts leapfrog steps per iteration with
# negligible ESS loss.
target_accept_theta = 0.9
# The smooth toy posterior uses the same depth-10 limit as stage-1.
max_tree_depth = 10

[io]
root_output = "results/Megamaser"
# Spot-table dataset: "original_published" | "fiducial". Selects both the
# tables under data/Megamaser/<dataset>/ and the matching init_<dataset>.toml
# best points, and namespaces root_output. Override with --dataset. The
# fiducial linear DE MAP init set is complete, so the erratum tables are the
# default.
dataset = "fiducial"
