[inference]
seed = 42
num_warmup = 2500
num_samples = 2000
init_strategy = "config"
init_num_samples = 100
n_inner = 25
max_tree_depth = 10
target_accept_prob = 0.9
target_accept_r = 0.44
blackjax_initial_step_size = 0.01

[model]
Om = 0.315
use_selection = false
sigma_v_default = 0.25
D_c_prior = "uniform"
mass_parameterization = "eta"  # choices: "eta", "log_mbh"
R_phys_lo = 0.01
R_phys_hi = 1.5

# HV (red/blue): 3 uniform sub-ranges centred on the peak:
#   [peak-outer, peak-inner]  (n_phi_hv_low points)
#   [peak-inner, peak+inner]  (n_phi_hv_high points, dense)
#   [peak+inner, peak+outer]  (n_phi_hv_low points)
# Reid convention: red peak at phi=+pi/2, blue peak at phi=-pi/2.
phi_hv_inner_deg = 30.0
phi_hv_outer_deg = 90.0
n_phi_hv_high = 5001
n_phi_hv_low = 2501

# Systemic: explicit list of disjoint sub-ranges around phi=0 and
# phi=pi (Reid convention). Each sub-range is uniform, n_phi_sys
# points, trapezoidal.
phi_sys_ranges_deg = [[-45, 45], [135, 225]]
n_phi_sys = 5001

# Conditional r_ang MAP grid used by the DE objective and numerical
# quadrature diagnostics. The production Gibbs sampler samples the
# non-centred log residual z_r = log(r_ang / r_hat(theta)).
n_r_local = 256
n_r_global = 128
K_sigma = 10.0
refine_r_center = true
n_refine_steps = 32
conditional_spot_batch = 16

[model.priors.log_MBH]
dist = "uniform"
low = 4.0
high = 10.0

[model.priors.dv_sys]
dist = "normal"
loc = 0.0
scale = 300.0

[model.priors.x0]
dist = "truncated_normal"
mean = 0.0
scale = 500.0
low = -750.0
high = 750.0

[model.priors.y0]
