[inference]
seed = 44
num_warmup = 2500
num_samples = 2000
num_chains = 1
init_strategy = "config"
init_num_samples = 1
n_inner = 30
latent_burnin = 1000        # latent burn-in steps: stage-1 per-galaxy (run_maser.py, config/reid init only) and stage-2 joint-H0 (run_joint_H0.py)
max_tree_depth = 11
target_accept_theta = 0.99
target_accept_r = 0.35
blackjax_initial_step_size = 0.005
phi_step_size = 0.05
reflect_prob = 0.25

[model]
Om = 0.315
use_selection = false
sigma_v_default = 0.25
D_c_prior = "uniform_D_A"
mass_parameterization = "eta"  # choices: "eta", "log_mbh"
R_phys_lo = 0.01
R_phys_hi = 1.5

# HV (red/blue): 3 uniform sub-ranges centred on the peak:
#   [peak-outer, peak-inner]  (n_phi_hv_low points)
#   [peak-inner, peak+inner]  (n_phi_hv_high points, dense)
#   [peak+inner, peak+outer]  (n_phi_hv_low points)
# Reid convention: red peak at phi=+pi/2, blue peak at phi=-pi/2.
phi_hv_inner_deg = 30.0
phi_hv_outer_deg = 90.0
n_phi_hv_high = 5001
n_phi_hv_low = 2501

# Systemic: marginalise over the full phi range to avoid window leakage
# in fixed-r diagnostics and production runs.
phi_sys_ranges_deg = [[-180, 180]]
n_phi_sys = 10001

# Conditional r_ang MAP grid used by the DE objective and numerical
# quadrature diagnostics. The explicit MCMC sampler uses the non-centred
# log residual z_r = log(r_ang / r_hat(theta)).
n_r_local = 256
n_r_global = 128
K_sigma = 10.0
refine_r_center = true
n_refine_steps = 32
conditional_spot_batch = 16

[model.priors.log_MBH]
dist = "uniform"
low = 4.0
high = 10.0

[model.priors.dv_sys]
dist = "normal"
loc = 0.0
scale = 300.0

[model.priors.x0]
dist = "truncated_normal"
mean = 0.0
scale = 500.0
low = -750.0
high = 750.0

[model.priors.y0]
dist = "truncated_normal"
mean = 0.0
scale = 500.0
low = -750.0
high = 750.0

[model.priors.i0]
dist = "sine_angle"
low = 65.0
high = 115.0

[model.priors.Omega0]
dist = "uniform"
low = 0.0
high = 360.0

[model.priors.dOmega_dr]
dist = "uniform"
low = -30.0
high = 30.0

[model.priors.di_dr]
dist = "uniform"
low = -30.0
high = 30.0

[model.priors.d2i_dr2]
dist = "normal"
loc = 0.0
scale = 90.0

[model.priors.d2Omega_dr2]
dist = "normal"
loc = 0.0
scale = 90.0

[model.priors.sigma_x_floor]
dist = "truncated_normal"
mean = 10.0
scale = 5.0
low = 0.5
high = 100.0

[model.priors.sigma_y_floor]
dist = "truncated_normal"
mean = 10.0
scale = 5.0
low = 0.5
high = 100.0

[model.priors.sigma_v_sys]
dist = "truncated_normal"
mean = 2.0
scale = 1.0
low = 0.5
high = 100.0

[model.priors.sigma_v_hv]
dist = "truncated_normal"
mean = 2.0
scale = 1.0
low = 0.5
high = 100.0

[model.priors.sigma_a_floor]
dist = "truncated_normal"
mean = 0.3
scale = 0.15
low = 0.02
high = 0.75

[model.priors.ecc]
dist = "uniform"
low = 0.0
high = 0.05

[model.priors.periapsis]
dist = "uniform"
low = 0.0
high = 360.0

# Gaussian e_x, e_y => e ~ Rayleigh(scale), omega ~ Uniform, smooth through
# e=0 (no funnel for NUTS). scale set from near-circular MCP disks (Reid
# NGC4258 e~0.008).
[model.priors.e_x]
dist = "normal"
loc = 0.0
scale = 0.025

[model.priors.e_y]
dist = "normal"
loc = 0.0
scale = 0.025

# Periapsis warp pegged to 0: with e~0 it multiplies an already-tiny effect
# and is unidentifiable. Delta => excluded from the NUTS sites.
[model.priors.dperiapsis_dr]
dist = "delta"
value = 0.0

