[convergence.fixed_r_reference]
n_phi = 200001
spot_batch = 8

[convergence.fixed_r_gradient_reference]
n_phi = 50001
spot_batch = 4

[optimise]
# DE always uses L-SHADE (current-to-pbest/1, success-history F/CR, and linear
# population reduction). Its population contains only the data-derived ridge
# and Sobol points; Pesce/Reid is never seeded and is scored only as a reference.
log2_N = 14
pop_size = 2000
min_pop_size = 128
# L-SHADE's population reduction is driven by population fitness evaluations,
# independently of max_generations.  This horizon brings 2000 -> 128 in about
# 5000 generations; it is not an NFE cap.  Evaluations continue with 128
# members until patience or max_generations stops the run.
population_reduction_evaluations = 3400000
max_generations = 5000
patience = 500
# The evaluator always scores one DE candidate per GPU wave. This is an
# implementation invariant, not a configurable optimiser parameter.
log_every = 1
sobol_n_sigma = 5
min_dist_frac = 0.005

[joint.selection]
# HEALPix nside for the isotropic LOS average of the selection normalisation.
los_nside = 2

# Default voxel subsample fraction for the 3D selection-normalisation integral,
# per reconstruction. Lower = less GPU memory and cost, at the price of a
# Monte-Carlo (seed-controlled) estimate of log_Z. The
# --volume-subsample-fraction CLI flag overrides these. The `manticorelocal`
# key matches any reconstruction whose name starts with it.
[joint.selection.volume_subsample_fraction]
default = 1.0
Carrick2015 = 0.25
manticorelocal = 0.1

[joint.priors.sigma_pec]
dist = "maxwell"
scale = 156.7

[joint.priors.Vext_mag]
dist = "uniform"
lower = 0.0
upper = 2000.0

# Informative Vext prior per reconstruction: a static Gaussian (mean + full
# 3x3 covariance) in the ICRS-equatorial Cartesian frame (km/s).  When a
# reconstruction is listed here the joint model samples Vext directly in
# Cartesian from this Gaussian; a reconstruction absent here falls back to the
# uniform Vext_mag prior above.  The numbers are fit offline from each
# reconstruction's own Vext posterior with scripts/megamaser/extract_vext_prior.py
# (--files ... --name ...); the model does not read those posteriors at runtime.
# ManticoreLocalCOLA: |Vext|=111+/-15 km/s, (l,b)=(310,-11) deg.
[joint.priors.Vext_informative.ManticoreLocalCOLA]
mean = [-26.5437, -19.2797, -106.1473]
cov = [[164.2089, -0.4046, -23.1390],
       [-0.4046, 217.7947, 6.2871],
       [-23.1390, 6.2871, 231.2666]]
# Carrick2015: |Vext|=201+/-16 km/s, (l,b)=(306,-16) deg.
[joint.priors.Vext_informative.Carrick2015]
mean = [-36.1490, -19.6859, -196.4901]
cov = [[156.8661, -26.3909, 3.0010],
       [-26.3909, 294.0757, 6.1991],
       [3.0010, 6.1991, 254.0994]]

[joint.inference]
# Stage-2 joint-H0 NUTS settings (override the shared [inference] block, which
# is also used by stage-1 per-galaxy runs).
num_warmup = 3000
num_samples = 5000          # per chain
# Target acceptance lower than the stage-1 0.99: the ~10-parameter toy
# posterior is smooth, so 0.9 cuts leapfrog steps per iteration with
# negligible ESS loss.
target_accept_theta = 0.9
# One doubling below the stage-1 single-disc 11: the smooth toy posterior needs
# fewer leapfrog steps; single-disc runs keep [inference].max_tree_depth = 11.
max_tree_depth = 10

[io]
root_output = "results/Megamaser"

[io.maser_data]
root = "data/Megamaser"
