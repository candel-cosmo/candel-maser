# Dataset-specific per-galaxy values for `--dataset fiducial`:
# the DE MAP best points ([model.galaxies.<G>.init*]) and the warp-pivot
# radii (r_ang_ref_*).
#
# The linear DE MAP [init] blocks are complete for all six galaxies.
# CGCG074-064 and NGC4258 have byte-identical tables in both datasets, so their
# init blocks are kept aligned with init_original_published.toml.
#
# The r_ang_ref_* pivots are shared verbatim with original_published for all
# six galaxies. A pivot is only a reparameterisation of the warp expansion,
# and holding it fixed keeps di_dr / d2i_dr2 / dOmega_dr directly comparable
# between the two datasets — which is the point of having both. The fiducial
# spot sets move the mean high-velocity radius by at most 4.3 per cent
# (NGC6323), so the DE warp lever scales stay well calibrated.
